services:
  db:
    image: postgres:16-alpine
    container_name: zalio-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zalio_erp
      POSTGRES_PASSWORD: zalio_erp_secret
      POSTGRES_DB: zalio_erp
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
